[package]
name = "diapo"
version = "0.1.0"
edition = "2024"
description = "Presentations that open and save PowerPoint files, with Claude in a side panel"
license = "MIT"
repository = "https://github.com/GoldenSheeeep/diapo"

[[bin]]
name = "slides"
path = "src/main.rs"

[dependencies]
atelier = { git = "https://github.com/GoldenSheeeep/atelier", rev = "1bfafed9ec64648dd178f5b77dc4e047fbf5dba6" }
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "9", default-features = false, features = ["deflate"] }
quick-xml = "0.42"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
